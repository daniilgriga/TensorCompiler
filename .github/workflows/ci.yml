name: CI

on:
  push:
    branches: [dev, main, feat/**, chore/**, fix/**]
  pull_request:
    branches: [dev, main]

jobs:
  build-ubuntu:
    name: Ubuntu (GCC Debug)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev \
            protobuf-compiler libprotobuf-dev

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  build-ubuntu-release:
    name: Ubuntu (GCC Release)
    runs-on: ubuntu-24.04
    needs: build-ubuntu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev \
            protobuf-compiler libprotobuf-dev

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  build-macos:
    name: macOS (Clang)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: brew install cmake ninja googletest protobuf

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  build-codegen-macos:
    name: macOS (Clang Codegen)
    runs-on: macos-latest
    needs: build-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: brew install cmake ninja googletest protobuf llvm

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -S . -B build-codegen -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_CODEGEN=ON \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DMLIR_DIR="${LLVM_PREFIX}/lib/cmake/mlir"

      - name: Build
        run: cmake --build build-codegen

      - name: Unit tests
        run: ctest --test-dir build-codegen --output-on-failure

  build-codegen-ubuntu:
    name: Ubuntu (GCC Codegen)
    runs-on: ubuntu-24.04
    needs: build-ubuntu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev \
            protobuf-compiler libprotobuf-dev wget gnupg lsb-release software-properties-common

          # Pin LLVM/MLIR to 22 to match local development API.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libmlir-22-dev mlir-22-tools

          echo "LLVM_CMAKE_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "MLIR_CMAKE_DIR=/usr/lib/llvm-22/lib/cmake/mlir" >> "$GITHUB_ENV"

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: |
          cmake -S . -B build-codegen -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_CODEGEN=ON \
            -DLLVM_DIR="${LLVM_CMAKE_DIR}" \
            -DMLIR_DIR="${MLIR_CMAKE_DIR}"

      - name: Build
        run: cmake --build build-codegen

      - name: Unit tests
        run: ctest --test-dir build-codegen --output-on-failure
