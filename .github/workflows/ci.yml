name: CI

on:
  push:
    branches: [dev, main, feat/**, chore/**, fix/**]
  pull_request:
    branches: [dev, main]

jobs:
  build-ubuntu:
    name: Ubuntu (GCC Debug)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev \
            protobuf-compiler libprotobuf-dev

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  build-ubuntu-release:
    name: Ubuntu (GCC Release)
    runs-on: ubuntu-24.04
    needs: build-ubuntu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev \
            protobuf-compiler libprotobuf-dev

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  build-macos:
    name: macOS (Clang)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: brew install cmake ninja googletest protobuf

      - name: Generate test models
        run: |
          python3 -m pip install numpy onnx
          python3 tests/gen_test_models.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
